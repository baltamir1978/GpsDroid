[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Material 3 Expressive (como VideoDroid): la barra flotante y el progreso ondulado sólo están en la 1.5.
material3 = "1.5.0-rc01"
lifecycle = "2.11.0"
coroutines = "1.11.0"
osmdroid = "6.1.20"
# La 1.7.10 no la tiene JitPack; los datos (segments4) y perfiles son los mismos en toda la 1.7.
brouter = "v1.7.9"
# Android Auto (plantillas de la Car App Library; la 1.8 aún no es estable).
carApp = "1.7.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
brouter-core = { module = "com.github.abrensch.brouter:brouter-core", version.ref = "brouter" }
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
